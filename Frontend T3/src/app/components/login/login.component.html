<div class="login-container">
    <div class="login-card">
        <div class="brand-header">
            <h1 class="brand-title">CHILI'S</h1>
            <p class="brand-subtitle">Sistema de Gestión de Salón y Cocina</p>
        </div>

        <form (ngSubmit)="onLogin()" class="login-form">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" [(ngModel)]="usuario"
                    placeholder="Ej. mozo1, admin, cocinero1" class="form-control" [disabled]="loading" required />
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="••••••••"
                    class="form-control" [disabled]="loading" required />
            </div>

            <div *ngIf="errorMessage" class="alert-error">
                {{ errorMessage }}
            </div>

            <button type="submit" class="btn-primary" [disabled]="loading">
                <span *ngIf="!loading">INGRESAR AL SISTEMA</span>
                <span *ngIf="loading">Cargando perfil...</span>
            </button>
        </form>
    </div>
</div>
