spring.application.name=demo
server.port=8080

# Conexión a MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/Siosi?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA (validate asegura que valide contra nuestra BD previa sin modificarla)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Inhabilitar inicializaciones dinámicas de Spring
spring.sql.init.mode=never